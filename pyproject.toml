[project]
name = "roxy-blender-mcp"
version = "2.1.9"
description = "Roxy-BlenderMCP: an independently maintained fork of MCP for Blender (not affiliated with Blender Foundation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Roxy"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.26.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
roxy-blender-mcp = "blender_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon.py", "apps/*.html", "guides/*.md", "session_rules.md"]

[project.urls]
"Upstream" = "https://github.com/ahujasid/blender-mcp"
